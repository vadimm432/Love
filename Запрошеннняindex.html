<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ed6688">
<title>Запрошення на побачення</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap');
:root{--pink:#ed6688;--pink2:#f17c98;--pale:#ffedf0;--ink:#292744;--muted:#9290a0;--line:#e8e6eb}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Comfortaa,"Trebuchet MS",sans-serif;color:var(--ink)}
body{background:linear-gradient(180deg,#fff 0%,#fff 56%,#f8eef1 100%);min-height:100vh}
button,input{font:inherit}
#app{max-width:520px;margin:0 auto;padding:18px 18px 38px;min-height:100vh}
.navbar{height:60px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.navbtn{border:0;background:transparent;color:#88869a;font-size:17px;padding:10px 0;cursor:pointer}
.next{border:0;border-radius:40px;padding:16px 29px;color:white;font-size:17px;background:linear-gradient(100deg,#e9577d,#f17c98);box-shadow:0 8px 18px #ed66882b;cursor:pointer;min-width:148px}
.next{display:none!important}
.next:active,.action:active{transform:scale(.98)}
.preview-wrap{display:flex;flex-direction:column;align-items:center}
.card{width:min(100%,420px);background:white;border-radius:38px;padding:13px;box-shadow:0 7px 24px #29274417,0 1px 5px #2927440a}
.card-bg{background:#ffedf0;border-radius:30px;padding:28px 22px;min-height:620px;display:flex}
.paper{position:relative;isolation:isolate;background:white;width:100%;border-radius:20px;padding:28px 18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.paper:before,.paper:after{content:"";position:absolute;z-index:-1;left:0;right:0;height:18px;background:radial-gradient(circle at 9px 9px,#fff 9px,transparent 9.7px) repeat-x;background-size:18px 18px}
.paper:before{top:0}.paper:after{bottom:0}
.stage{width:100%;text-align:center;animation:appear .42s ease both}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.photo{width:min(100%,300px);aspect-ratio:1;object-fit:cover;border-radius:19px;display:block;margin:0 auto 22px;box-shadow:0 5px 16px #2c203012}
h1{font-size:clamp(23px,5.8vw,29px);font-weight:500;line-height:1.34;margin:10px auto 18px;max-width:330px}
.copy{font-size:17px;line-height:1.55;margin:10px auto 18px;max-width:325px}
.buttons{display:flex;flex-direction:column;gap:12px;width:min(100%,280px);margin:32px auto 2px}
.action{border:0;border-radius:50px;padding:15px 18px;font-size:17px;cursor:pointer;transition:transform .18s,filter .2s}
.yes{background:linear-gradient(100deg,#e9577d,#f17c98);color:white}
.no{background:#ffedf0;color:#d97891}
.under{color:#df7891;font-size:17px;border:0;background:transparent;margin:20px auto 0;cursor:pointer}
.helper{color:#a6a2ae;font-size:13px;min-height:18px;margin:10px 0 0}
.field{max-width:300px;margin:13px auto;text-align:left}
.field label{display:block;font-size:15px;margin:0 0 8px 3px}
.field input{width:100%;height:54px;border:1px solid #dedde3;border-radius:14px;padding:0 17px;font-size:17px;color:var(--ink);background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:330px;margin:24px auto 18px}
.option{border:1px solid #e7e4e9;background:#fff;border-radius:17px;min-height:112px;padding:13px 8px;color:var(--ink);font-size:15px;line-height:1.35;cursor:pointer;transition:.18s}
.option .emoji{display:block;font-size:31px;margin-bottom:8px}
.option.selected{border:2px solid var(--pink);background:#fff7f8;box-shadow:0 4px 13px #ed66881c}
.mode{display:flex;background:#f3f2f8;border-radius:40px;padding:4px;margin:0 auto 18px;max-width:340px}
.mode button{flex:1;border:0;border-radius:30px;padding:11px 8px;background:transparent;color:var(--ink);font-size:13px}
.mode button.active{background:#292744;color:#fff}
.ticket{max-width:300px;margin:14px auto 18px;padding:31px 22px 24px;color:white;background:linear-gradient(150deg,#ee6b8c,#f1849d);position:relative;filter:drop-shadow(0 8px 12px #d95c7a30);border-radius:5px}
.ticket:before,.ticket:after{content:"";position:absolute;left:0;right:0;height:13px;background:radial-gradient(circle at 7px 0,#ffedf0 7px,transparent 7.5px) repeat-x;background-size:14px 14px}
.ticket:before{top:0}.ticket:after{bottom:0;transform:rotate(180deg)}
.ticket .tiny{font-size:11px;letter-spacing:3px}
.ticket h2{font-weight:500;font-size:31px;margin:13px 0 18px}
.ticket .data{border:1px dashed #ffffffa8;border-radius:12px;padding:12px;margin:10px 0;font-size:17px}
.ticket .barcode{font-size:22px;letter-spacing:3px;margin:18px 0 0}
.result-list{max-width:310px;margin:18px auto;text-align:left;background:#fff7f8;border:1px solid #f6d5de;border-radius:18px;padding:16px 18px}
.result-row{padding:9px 0;border-bottom:1px solid #f1e2e7;font-size:14px;line-height:1.5}
.result-row:last-child{border:0}.result-label{color:#d97891;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.telegram{background:linear-gradient(100deg,#229ed9,#38b6ed);color:white}.small-note{font-size:12px;line-height:1.5;color:#9995a2;max-width:300px;margin:12px auto}
.replay{display:block;margin:24px auto 0;border:0;background:transparent;color:#d97891;font-size:17px;cursor:pointer}
.footer{font-size:11px;color:#b5aeb6;text-align:center;margin:18px 0}
#lock{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;z-index:10;background:linear-gradient(150deg,#ed5f83,#f17d99);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:26px;overflow:hidden}
#lock:before,#lock:after{content:"";position:absolute;width:260px;height:260px;background-image:linear-gradient(#d94c751f 1px,transparent 1px),linear-gradient(90deg,#d94c751f 1px,transparent 1px);background-size:28px 28px;transform:rotate(45deg);opacity:.65}
#lock:before{left:-160px;top:18%}#lock:after{right:-160px;bottom:8%}
.lock-content{position:relative;z-index:1;width:min(100%,340px)}
.finger-frame{width:218px;height:218px;margin:0 auto 24px;position:relative;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;outline:none}
.finger-frame:before{content:"";position:absolute;inset:0;border:1px solid #ffffff55;border-radius:50%;animation:ring 2.8s ease-out infinite}
.finger-frame:after{content:"";position:absolute;inset:14px;border:1px solid #ffffff45;border-radius:50%;animation:ring 2.8s 1s ease-out infinite}
.heart-button{width:174px;height:174px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#ffe8ee);box-shadow:0 12px 34px #9f294a40,inset 0 0 0 7px #ffffff70;color:#ed6688;font-size:88px;line-height:1;transition:transform .18s,box-shadow .18s;user-select:none}
.finger-frame:active .heart-button{transform:scale(.91);box-shadow:0 5px 18px #9f294a45,inset 0 0 0 7px #ffffff70}
.finger-frame.opening .heart-button{animation:heartPop .55s ease both}
@keyframes heartPop{0%{transform:scale(1)}45%{transform:scale(.86)}100%{transform:scale(1.08)}}
@keyframes ring{0%{transform:scale(.78);opacity:.9}100%{transform:scale(1.3);opacity:0}}
@keyframes press{to{transform:scale(.94);filter:brightness(1.16)}}
@keyframes scanline{from{top:22%}to{top:78%}}
.lock-title{font-size:23px;line-height:1.45;letter-spacing:.2px}
.lock-caption{font-size:12px;letter-spacing:1px;opacity:.82;margin-top:18px}
#lock.hidden{display:none}
.burst{position:fixed;z-index:20;pointer-events:none;font-size:23px;animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(80deg) scale(.2);opacity:0}}
@media(max-height:760px){.card-bg{min-height:540px;padding:20px 16px}.paper{padding:22px 14px}.photo{width:min(100%,240px);margin-bottom:16px}.buttons{margin-top:20px}}
</style>
</head>
<body>
<div id="lock">
 <div class="lock-content">
  <button class="finger-frame" id="finger" type="button" aria-label="Натисни на сердечко, щоб відкрити запрошення"><span class="heart-button" aria-hidden="true">♥</span></button>
  <div class="lock-title">Натисни на сердечко,<br>щоб відкрити запрошення</div>
  <div class="lock-caption">ОДИН ДОТИК — І ЦЕЙ ВЕЧІР ТРОХИ БЛИЖЧЕ ♥</div>
 </div>
</div>
<div id="app">
 <div class="navbar"><button class="navbtn" id="back">← Назад</button><button class="next" id="next">Далі →</button></div>
 <div class="preview-wrap">
  <div class="card"><div class="card-bg"><div class="paper"><div class="stage" id="stage"></div></div></div></div>
  <button class="replay" id="replay">Подивитись ще раз ↻</button>
  <div class="footer">маленький квиток на особливий вечір ♡</div>
 </div>
</div>

let step=0,selected=[],multi=true,chosenDate="2026-11-27",chosenTime="18:20";
const stage=document.getElementById("stage"),next=document.getElementById("next"),back=document.getElementById("back");
function burst(){
 for(let i=0;i<17;i++){let e=document.createElement("span");e.className="burst";e.textContent=["♥","♡","💗"][i%3];e.style.left=(45+Math.random()*10)+"vw";e.style.top=(42+Math.random()*12)+"vh";e.style.setProperty("--x",(Math.random()*360-180)+"px");e.style.setProperty("--y",(Math.random()*-300-40)+"px");document.body.append(e);setTimeout(()=>e.remove(),1200)}
}
function go(n){step=Math.max(0,Math.min(4,n));render();window.scrollTo({top:0,behavior:"smooth"})}
function render(){
 back.style.visibility=step===0?"hidden":"visible";next.style.display=step>=4?"none":"inline-block";
 let h="";
 if(step===0) h=`<img class="photo" src="${pics.cat}" alt="Кумедне кошеня з поцілунком"><h1>Ти підеш зі мною на побачення?</h1><div class="buttons"><button class="action yes" id="yes">Звісно</button><button class="action no" id="no">Подумаю</button></div><div class="helper" id="hint"></div>`;
 if(step===1) h=`<img class="photo" src="${pics.man}" alt="Реакційне фото"><h1>Почекай, ти дійсно хочеш піти?</h1><p class="copy">Я думав, у тебе як завжди багато справ</p><div class="buttons"><button class="action yes" id="confirm">Так, хочу</button></div>`;
 if(step===2) h=`<img class="photo" src="${pics.orange}" alt="Кумедний рудий кіт"><h1>Коли тобі зручно зустрітись?</h1><div class="field"><label for="date">Дата</label><input id="date" type="date" value="${chosenDate}"></div><div class="field"><label for="time">Час</label><input id="time" type="time" value="${chosenTime}"></div><div class="buttons"><button class="action yes" id="dateok">Підтвердити</button></div><div class="helper" id="hint"></div>`;
 if(step===3) h=`<h1>Чим займемось?</h1><div class="grid">${options.map((o,i)=>`<button class="option ${selected.includes(i)?"selected":""}" data-i="${i}"><span class="emoji">${o[0]}</span>${o[1]}</button>`).join("")}</div><div class="buttons"><button class="action yes" id="activitiesok">Підтвердити</button></div><div class="helper" id="hint">${selected.length?"Обрано "+selected.length+" з "+options.length:"Можна обрати декілька варіантів"}</div>`;
 if(step===4) h=`<div class="ticket"><div class="tiny">ПЕРСОНАЛЬНЕ ЗАПРОШЕННЯ</div><h2>Побачення</h2><div style="font-size:15px;margin:-5px 0 18px">для Насті ♥</div><div class="data">▢ &nbsp;${formatDate(chosenDate)}</div><div class="data">◷ &nbsp;${chosenTime}</div><div style="font-size:14px;line-height:1.55;margin:15px 0">${selected.map(i=>options[i][0]+" "+options[i][1]).join("<br>")}</div><div class="barcode">▥ ▥ ▥ ▥ ▥ ▥</div><div style="font-size:12px;letter-spacing:3px;margin-top:10px">♥ &nbsp; ♥ &nbsp; ♥</div><div style="font-size:11px;line-height:1.5;margin-top:14px">ОДИН ВЕЧІР · ДВОЄ ЛЮДЕЙ · БЕЗЛІЧ СПОГАДІВ</div></div><button class="action telegram" style="width:min(100%,300px)" id="sendticket">↗ Надіслати квиток</button><p class="small-note">Натисни, обери наш чат у Telegram і підтверди надсилання. Разом із квитком піде дата, час і твої обрані активності 💗</p><button class="action no" style="width:min(100%,280px);margin-top:4px" id="calendar">Додати в календар</button><p class="copy" style="margin-top:18px">До зустрічі. Обіцяю, буде гарно 💗</p>`;
 stage.innerHTML=h;
 document.getElementById("yes")?.addEventListener("click",()=>{burst();go(1)});
 document.getElementById("no")?.addEventListener("click",()=>{let b=document.getElementById("no");b.animate([{transform:"translateX(0)"},{transform:"translateX(45px) scale(.9)"},{transform:"translateX(-35px) scale(.75)"},{transform:"translateX(0) scale(.8)"}],{duration:650});document.getElementById("hint").textContent="Ха-ха, подумай ще раз 🙈"});
 document.getElementById("confirm")?.addEventListener("click",()=>go(2));
 document.getElementById("dateok")?.addEventListener("click",()=>{chosenDate=document.getElementById("date").value;chosenTime=document.getElementById("time").value;if(!chosenDate||!chosenTime){document.getElementById("hint").textContent="Обери дату й час, будь ласка";return}go(3)});
 stage.querySelectorAll("[data-i]").forEach(b=>b.addEventListener("click",()=>{let i=+b.dataset.i;if(selected.includes(i))selected=selected.filter(x=>x!==i);else selected=[...selected,i];render()}));
 document.getElementById("activitiesok")?.addEventListener("click",()=>{if(!selected.length){document.getElementById("hint").textContent="Обери хоча б один варіант";return}go(4)});
 document.getElementById("together")?.addEventListener("click",()=>{multi=true;render()});
 document.getElementById("mine")?.addEventListener("click",()=>{multi=false;render()});
 document.getElementById("calendar")?.addEventListener("click",calendar);
 document.getElementById("sendticket")?.addEventListener("click",()=>{
  const activities=selected.map(i=>options[i][0]+" "+options[i][1]).join(", ");
  const message=`💗 МІЙ КВИТОК НА ПОБАЧЕННЯ 💗\n\nДля: тебе\nДата: ${formatDate(chosenDate)}\nЧас: ${chosenTime}\nПлан: ${activities}\n\nТак, я хочу піти на побачення! Чекаю на нашу зустріч ❤️`;
  const pageUrl=window.location.href.startsWith("http")?window.location.href:"";
  const shareUrl="https://t.me/share/url?url="+encodeURIComponent(pageUrl)+"&text="+encodeURIComponent(message);
  // iOS дозволяє navigator.share лише синхронно в момент тапу, тому PNG готується заздалегідь (prepareTicket)
  try{
   if(ticketFile && navigator.share && navigator.canShare && navigator.canShare({files:[ticketFile]})){
    navigator.share({files:[ticketFile],text:message}).catch(e=>{
     if(e && e.name==="AbortError") return;
     window.location.href=shareUrl;
    });
    return;
   }
  }catch(e){}
  const a=document.createElement("a");a.href=shareUrl;a.target="_blank";a.rel="noopener noreferrer";document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);
 });
 if(step===4) prepareTicket();
}
function formatDate(s){if(!s)return "дату оберемо разом";let [y,m,d]=s.split("-");return `${d}.${m}.${y.slice(2)}`}
let ticketFile=null,ticketKey="";
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function prepareTicket(){
 const key=chosenDate+"|"+chosenTime+"|"+selected.join(",");
 if(key===ticketKey&&ticketFile) return;
 ticketKey=key;ticketFile=null;
 try{
  const canvas=document.createElement("canvas"); canvas.width=1000; canvas.height=1400;
  const c=canvas.getContext("2d");
  const grad=c.createLinearGradient(0,0,1000,1400); grad.addColorStop(0,"#ee6b8c"); grad.addColorStop(1,"#f59bb0");
  c.fillStyle=grad; c.fillRect(0,0,1000,1400);
  c.fillStyle="#fff"; rrect(c,70,70,860,1260,38); c.fill();
  c.fillStyle="#d9577b"; c.textAlign="center";
  c.font="bold 34px sans-serif"; c.fillText("ПЕРСОНАЛЬНЕ ЗАПРОШЕННЯ",500,190);
  c.font="bold 86px sans-serif"; c.fillText("Побачення",500,330);

function calendar(){
 let start=chosenDate.replace(/-/g,"")+"T"+chosenTime.replace(":","")+"00";
 let dt=new Date(chosenDate+"T"+chosenTime+":00");dt.setHours(dt.getHours()+2);
 let pad=n=>String(n).padStart(2,"0"),end=dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+"T"+pad(dt.getHours())+pad(dt.getMinutes())+"00";
 let stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
 let ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Pobachennia//UK\r\nCALSCALE:GREGORIAN\r\nBEGIN:VEVENT\r\nUID:${Date.now()}@pobachennia\r\nDTSTAMP:${stamp}\r\nDTSTART:${start}\r\nDTEND:${end}\r\nSUMMARY:Побачення 💗\r\nDESCRIPTION:Особливий вечір\r\nEND:VEVENT\r\nEND:VCALENDAR`;
 const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 if(isIOS){ window.location.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics); return; }
 let a=document.createElement("a"),url=URL.createObjectURL(new Blob([ics],{type:"text/calendar;charset=utf-8"}));a.href=url;a.download="pobachennia.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
